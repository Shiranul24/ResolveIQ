services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resolveiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveiq}
      POSTGRES_DB: resolveiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveiq -d resolveiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://resolveiq:${POSTGRES_PASSWORD:-resolveiq}@db:5432/resolveiq
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-in-production}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
    ports:
      - "8000:8000"

volumes:
  pgdata:
