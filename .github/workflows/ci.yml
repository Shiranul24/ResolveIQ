name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start API + PostgreSQL
        run: docker compose up -d --build --wait
      - name: Smoke test against PostgreSQL
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/api/auth/register -H 'Content-Type: application/json' \
            -d '{"name":"CI Admin","email":"ci@example.com","password":"Ci-pass-12345"}'
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Ci-pass-12345"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X POST http://localhost:8000/api/tickets -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"VPN keeps disconnecting","description":"The VPN drops every few minutes."}' | grep -q '"category":"network"'
          curl -fsS http://localhost:8000/api/analytics/summary -H "Authorization: Bearer $TOKEN" | grep -q '"total":1'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
